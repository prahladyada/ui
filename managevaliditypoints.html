<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recharge Plan Manager</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --indigo: #4338ca;
    --indigo-dark: #3730a3;
    --indigo-light: #eef2ff;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --bg: #f8fafc;
    --danger: #b91c1c;
    --ok: #15803d;
    --warn: #c2410c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
  }
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 0;
    gap: 16px;
  }

  /* ===== Standardized Page Header ===== */
  .pr-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0 14px 0;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line);
  }

  .pr-title {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
  }

  .pr-title svg {
    width: 28px;
    height: 28px;
    color: #4f46e5;
    background: #e0e7ff;
    padding: 5px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  /* ===== Form ===== */
  .form-row {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .field input {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font-size: 13.5px;
  }
  .field input:focus {
    outline: none;
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px var(--indigo-light);
  }
  #rechargeInput, #creditInput { width: 170px; }

  .time-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .time-group label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .time-selects {
    display: flex;
    gap: 8px;
  }
  .time-selects select {
    height: 34px;
    padding: 0 8px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
    min-width: 90px;
  }
  .time-selects select:focus {
    outline: none;
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px var(--indigo-light);
  }

  .btn-add {
    height: 36px;
    margin-left: auto;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 24px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(79, 70, 229, 0.25);
    transition: all 0.2s ease;
  }
  .btn-add:hover {
    background: #4338ca;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  /* ===== Table ===== */
  .table-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }
  .table-scroll {
    max-height: 420px;
    overflow: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f1f5f9;
    text-align: left;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    border-bottom: 2px solid var(--line-strong);
    white-space: nowrap;
    z-index: 1;
  }
  thead th.check-col { width: 40px; }
  tbody td {
    padding: 10px 16px;
    font-size: 13.5px;
    border-bottom: 1px solid #f1f5f9;
  }
  tbody tr:hover td { background: #f8fafc; }
  tbody tr.selected td { background: var(--indigo-light); }
  .amount-cell { font-weight: 700; color: var(--ink); }
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .status-active { background: #dcfce7; color: var(--ok); }
  .status-inactive { background: #f1f5f9; color: var(--ink-faint); }
  .empty-row td {
    text-align: center;
    color: var(--ink-faint);
    padding: 50px 14px;
    font-size: 13.5px;
  }

  /* ===== Bottom actions ===== */
  .actions-bar {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .action-btn {
    height: 36px;
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  .action-btn:hover { transform: translateY(-1px); }
  .action-btn:active { transform: translateY(0); }
  
  .btn-select {
    background: #fff;
    color: #475569;
    border: 1px solid #cbd5e1;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .btn-select:hover {
    background: #f8fafc;
    border-color: #94a3b8;
    color: #0f172a;
  }
  
  .btn-edit {
    background: #4f46e5;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(79, 70, 229, 0.25);
  }
  .btn-edit:hover {
    background: #4338ca;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }
  
  .btn-delete {
    background: #ef4444;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(239, 68, 68, 0.25);
  }
  .btn-delete:hover {
    background: #dc2626;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
  }
  
  .btn-toggle {
    background: #f59e0b;
  }
  .btn-toggle:hover {
    background: #d97706;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Standard Page Header -->
  <div class="pr-header">
    <div style="display: flex; align-items: center; gap: 14px;">
      <h2 class="pr-title">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Manage Limited Validity Points Plans
      </h2>
      <div style="font-size: 13px; color: #64748b;">Configure recharge plans with limited time validity windows</div>
    </div>
    <div>
      <button type="button" class="btn-select action-btn" style="height: 34px; padding: 0 14px; font-size: 13px;" onclick="if(window.parent&&window.parent!==window){window.parent.postMessage({type:'show-master'},'*');}else{history.back();}" title="Return to Master Dashboard">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Master</span>
      </button>
    </div>
  </div>

  <!-- Add recharge plan form -->
  <div class="panel">
    <div class="form-row">
      <div class="field">
        <label for="rechargeInput">Recharge amount (₹)</label>
        <input type="number" id="rechargeInput" placeholder="e.g. 2000" />
      </div>
      <div class="field">
        <label for="creditInput">Credit points</label>
        <input type="number" id="creditInput" placeholder="e.g. 3000" />
      </div>

      <div class="time-group">
        <label>Validity</label>
        <div class="time-selects">
          <select><option>0 Days</option><option>1 Day</option><option>7 Days</option><option>30 Days</option></select>
          <select><option>0 Hour</option><option>1 Hour</option><option>3 Hours</option><option>6 Hours</option></select>
          <select><option>0 Minutes</option><option>15 Minutes</option><option>30 Minutes</option><option>45 Minutes</option></select>
        </div>
      </div>

      <button class="btn-add">Add</button>
    </div>
  </div>

  <!-- Recharge plans table -->
  <div class="panel table-panel">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="check-col"><input type="checkbox" /></th>
            <th>Recharge amount (₹)</th>
            <th>Credit points</th>
            <th>Validity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="checkbox" /></td>
            <td class="amount-cell">₹2,000</td>
            <td>3,000</td>
            <td>3 Hrs</td>
            <td><span class="status-badge status-active">Active</span></td>
          </tr>
          <tr class="selected">
            <td><input type="checkbox" checked /></td>
            <td class="amount-cell">₹1,000</td>
            <td>2,000</td>
            <td>1 Day</td>
            <td><span class="status-badge status-active">Active</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bottom actions -->
  <div class="actions-bar">
    <button class="action-btn btn-select">Select all</button>
    <button class="action-btn btn-edit">Edit</button>
    <button class="action-btn btn-delete">Delete</button>
    <button class="action-btn btn-toggle">Toggle status</button>
  </div>

</div>
</body>
</html>
