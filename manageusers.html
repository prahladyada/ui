<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Manager</title>
<style>
  :root {
    /* Premium Color Palette */
    --indigo-50: #eef2ff;
    --indigo-100: #e0e7ff;
    --indigo-500: #6366f1;
    --indigo-600: #4f46e5;
    --indigo-700: #4338ca;
    --indigo-900: #312e81;

    --ink: #0f172a;
    --ink-soft: #334155;
    --ink-faint: #64748b;

    --line: #e2e8f0;
    --line-strong: #cbd5e1;

    --bg: #f8fafc;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --ok: #10b981;

    --radius: 12px;
    --radius-sm: 8px;

    /* Smooth Shadows */
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
    letter-spacing: -0.01em;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0;
    gap: 16px;
  }

  /* ===== Standardized Page Header ===== */
  .pr-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0 14px 0;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line);
  }

  .pr-title {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
  }

  .pr-title svg {
    width: 28px;
    height: 28px;
    color: #4f46e5;
    background: #e0e7ff;
    padding: 5px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .panel {
    background: #fff;
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease;
  }
  .panel:hover {
    box-shadow: var(--shadow-md);
  }

  /* ===== Add user form ===== */
  .form-panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .form-row {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .field input {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    width: 220px;
    background: #f8fafc;
    transition: all 0.2s ease;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
  }
  .field input:focus {
    outline: none;
    background: #fff;
    border-color: var(--indigo-500);
    box-shadow: 0 0 0 3px var(--indigo-100);
  }
  .btn-add {
    height: 36px;
    padding: 0 24px;
    margin-left: auto;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(79, 70, 229, 0.25);
    transition: all 0.2s ease;
  }
  .btn-add:hover {
    background: #4338ca;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  /* ===== Main body: user list | permissions ===== */
  .main-body {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 24px;
  }

  .col-panel {
    background: #fff;
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .col-users { flex: 0 0 320px; }
  .col-permissions { flex: 1 1 0; min-width: 0; }

  .col-head {
    flex: 0 0 auto;
    padding: 16px 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--indigo-900);
    background: #f8fafc;
    border-bottom: 1px solid var(--line);
    letter-spacing: -0.01em;
  }
  .col-scroll {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    text-align: left;
    padding: 12px 20px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    z-index: 1;
  }
  th.check-col { width: 44px; text-align: center; }
  tbody td {
    padding: 14px 20px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  tbody tr { cursor: pointer; transition: background 0.15s ease; }
  tbody tr:hover td { background: #f8fafc; }
  tbody tr.selected td { background: var(--indigo-50); color: var(--indigo-900); }
  .id-cell { color: var(--ink-faint); font-weight: 500; }
  tbody tr.selected .id-cell { color: var(--indigo-500); }
  
  .role-tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: #e2e8f0;
    color: var(--ink-soft);
  }
  tbody tr.selected .role-tag { background: var(--indigo-600); color: #fff; box-shadow: var(--shadow-sm); }
  
  td.check-col { text-align: center; color: var(--indigo-600); font-weight: 900; }

  /* Permissions panel */
  .perm-empty {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .perm-list {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 0;
  }
  .perm-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid #f8fafc;
    transition: background 0.15s ease;
  }
  .perm-item:hover {
    background: #f8fafc;
  }
  .perm-item input {
    width: 18px; height: 18px;
    accent-color: var(--indigo-600);
    cursor: pointer;
  }
  .perm-item label {
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    flex: 1;
  }

  /* ===== Bottom actions ===== */
  .bottom-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .actions-left, .actions-right {
    display: flex;
    gap: 12px;
  }
  .action-btn {
    height: 36px;
    padding: 0 18px;
    border: none;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  .action-btn:hover { transform: translateY(-1px); }
  .action-btn:active { transform: translateY(0); }
  
  .btn-template { background: #0284c7; }
  .btn-import { background: #059669; }
  .btn-export { background: #d97706; }
  .btn-print { background: #4f46e5; }
  
  .btn-select {
    background: #fff;
    color: #475569;
    border: 1px solid #cbd5e1;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .btn-select:hover {
    background: #f8fafc;
    border-color: #94a3b8;
    color: #0f172a;
  }
  
  .btn-delete {
    background: #ef4444;
    color: #fff;
    border: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(239, 68, 68, 0.25);
  }
  .btn-delete:hover {
    background: #dc2626;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
  }

  .btn-update {
    background: #4f46e5;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(79, 70, 229, 0.25);
  }
  .btn-update:hover {
    background: #4338ca;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }
</style>
</head>
<body>
<div class="app">

  <!-- Standard Page Header -->
  <div class="pr-header">
    <div style="display: flex; align-items: center; gap: 14px;">
      <h2 class="pr-title">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Manage Users
      </h2>
      <div style="font-size: 13px; color: #64748b;">Manage operator accounts, roles, and administrative permissions</div>
    </div>
    <div>
      <button type="button" class="btn-select action-btn" style="height: 34px; padding: 0 14px; font-size: 13px;" onclick="if(window.parent&&window.parent!==window){window.parent.postMessage({type:'show-master'},'*');}else{history.back();}" title="Return to Master Dashboard">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Master</span>
      </button>
    </div>
  </div>

  <!-- Add user form -->
  <div class="panel form-panel">
    <div class="form-row">
      <div class="field">
        <label for="userInput">Username</label>
        <input type="text" id="userInput" placeholder="e.g. jsmith" />
      </div>
      <div class="field">
        <label for="passInput">Password</label>
        <input type="password" id="passInput" placeholder="••••••••" />
      </div>
      <button class="btn-add">Add User</button>
    </div>
  </div>

  <!-- Main body -->
  <div class="main-body">

    <div class="col-panel col-users">
      <div class="col-head">Users List</div>
      <div class="col-scroll">
        <table>
          <thead>
            <tr>
              <th class="check-col"></th>
              <th>ID</th>
              <th>Username</th>
            </tr>
          </thead>
          <tbody>
            <tr class="selected">
              <td class="check-col">✓</td>
              <td class="id-cell">2</td>
              <td><span class="role-tag">admin</span></td>
            </tr>
            <tr>
              <td class="check-col"></td>
              <td class="id-cell">8</td>
              <td><span class="role-tag">staff</span></td>
            </tr>
            <tr>
              <td class="check-col"></td>
              <td class="id-cell">9</td>
              <td><span class="role-tag">user</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-panel col-permissions">
      <div class="col-head">Permissions for <span style="color: var(--indigo-600);">"admin"</span></div>
      <div class="perm-list">
        <div class="perm-item"><input type="checkbox" id="p1" checked /><label for="p1">Manage devices</label></div>
        <div class="perm-item"><input type="checkbox" id="p2" checked /><label for="p2">Manage games &amp; pricing</label></div>
        <div class="perm-item"><input type="checkbox" id="p3" checked /><label for="p3">Issue &amp; edit RFID cards</label></div>
        <div class="perm-item"><input type="checkbox" id="p4" checked /><label for="p4">Process recharges</label></div>
        <div class="perm-item"><input type="checkbox" id="p5" /><label for="p5">Delete transaction history</label></div>
        <div class="perm-item"><input type="checkbox" id="p6" /><label for="p6">Manage other users</label></div>
        <div class="perm-item"><input type="checkbox" id="p7" checked /><label for="p7">View reports</label></div>
        <div class="perm-item"><input type="checkbox" id="p8" /><label for="p8">Export data</label></div>
      </div>
    </div>

  </div>

  <!-- Bottom actions -->
  <div class="bottom-bar">
    <div class="actions-left">
      <button class="action-btn btn-template">Template</button>
      <button class="action-btn btn-import">Import</button>
      <button class="action-btn btn-export">Export</button>
      <button class="action-btn btn-print">Print</button>
    </div>
    <div class="actions-right">
      <button class="action-btn btn-select">Select all</button>
      <button class="action-btn btn-delete">Delete</button>
      <button class="action-btn btn-update">Update Permissions</button>
    </div>
  </div>

</div>
</body>
</html>
