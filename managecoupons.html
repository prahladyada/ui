<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Coupons & Promo Codes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-light: #eef2ff;
    --primary-border: #c7d2fe;

    --pink: #ec4899;
    --pink-dark: #db2777;
    --pink-light: #fdf2f8;
    --pink-border: #fbcfe8;

    --ink: #0f172a;
    --ink-soft: #334155;
    --ink-faint: #64748b;

    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --bg: #f8fafc;
    --bg-card: #ffffff;

    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;

    --ok: #10b981;
    --ok-bg: #ecfdf5;
    --ok-border: #a7f3d0;

    --amber: #f59e0b;
    --amber-bg: #fffbeb;
    --amber-border: #fde68a;

    --radius: 12px;
    --radius-sm: 8px;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    letter-spacing: -0.01em;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 14px 18px;
    gap: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* ===== Page Header ===== */
  .pr-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .pr-title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pr-icon-badge {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(236, 72, 153, 0.3);
  }

  .pr-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .pr-subtitle {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    background: #ffffff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-back:hover {
    background: #f1f5f9;
    color: var(--ink);
  }

  /* ===== Main Grid Layout ===== */
  .layout-grid {
    display: flex;
    gap: 14px;
    flex: 1;
    min-height: 0;
  }

  /* Left Form Card */
  .form-card {
    width: 360px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
    overflow-y: auto;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .form-group input,
  .form-group select {
    width: 100%;
    height: 35px;
    padding: 0 10px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: #ffffff;
    outline: none;
    transition: all 0.15s;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn-submit {
    height: 38px;
    background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(236, 72, 153, 0.3);
    transition: all 0.15s;
  }
  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
  }

  .btn-reset {
    height: 34px;
    background: #f1f5f9;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-reset:hover {
    background: #e2e8f0;
  }

  /* Right Table Card */
  .table-card {
    flex: 1;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 0;
  }

  .table-toolbar {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .search-box {
    position: relative;
    max-width: 280px;
    flex: 1;
  }

  .search-box input {
    width: 100%;
    height: 34px;
    padding: 0 10px 0 32px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font-size: 12.5px;
    outline: none;
  }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 9px;
    color: var(--ink-faint);
  }

  .table-wrap {
    flex: 1;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 12.5px;
  }

  th {
    background: #f8fafc;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 9px 12px;
    border-bottom: 1.5px solid var(--line);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 1;
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    vertical-align: middle;
  }

  tr:hover td {
    background: #f8fafc;
  }

  .badge-code {
    font-family: monospace;
    font-weight: 700;
    font-size: 13px;
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
  }
  .badge-status.active {
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok-border);
  }
  .badge-status.inactive {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger-border);
  }

  .btn-action-icon {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .btn-action-icon:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary-border);
  }
  .btn-action-icon.delete:hover {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: var(--danger-border);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1e293b;
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="pr-header">
    <div class="pr-title-group">
      <div class="pr-icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 5H3a2 2 0 0 0-2 2v3a2 2 0 0 1 0 4v3a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-3a2 2 0 0 1 0-4V7a2 2 0 0 0-2-2z"></path>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <circle cx="9.5" cy="14.5" r=".5" fill="currentColor"></circle>
          <circle cx="14.5" cy="9.5" r=".5" fill="currentColor"></circle>
        </svg>
      </div>
      <div>
        <h1 class="pr-title">Manage Coupons</h1>
        <div class="pr-subtitle">Configure discount promo codes &amp; billing rules</div>
      </div>
    </div>
    <button type="button" class="btn-back" onclick="handleBack()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span>Back to Master</span>
    </button>
  </div>

  <!-- Layout Grid -->
  <div class="layout-grid">
    <!-- Form Card -->
    <div class="form-card">
      <div class="card-head">
        <span class="card-title" id="formCardTitle">
          <svg width="16" height="16" fill="none" stroke="#ec4899" stroke-width="2.2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add New Coupon
        </span>
        <input type="hidden" id="couponEditId" value="" />
      </div>

      <div class="form-group">
        <label>Coupon Code *</label>
        <input type="text" id="couponCode" placeholder="e.g. DIWALI50" style="text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;" />
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Discount Type *</label>
          <select id="couponType" onchange="handleTypeChange()">
            <option value="flat">Flat Amount (₹)</option>
            <option value="percent">Percentage (%)</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lblDiscountVal">Discount Value (₹) *</label>
          <input type="number" id="couponValue" min="1" step="any" placeholder="e.g. 50" />
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Min Recharge (₹)</label>
          <input type="number" id="couponMinBill" min="0" value="0" placeholder="0 = No limit" />
        </div>
        <div class="form-group" id="grpMaxDiscount" style="display: none;">
          <label>Max Discount (₹)</label>
          <input type="number" id="couponMaxDiscount" min="0" placeholder="Optional cap" />
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Expiry Date</label>
          <input type="date" id="couponExpiry" />
        </div>
        <div class="form-group">
          <label>Usage Limit</label>
          <input type="number" id="couponUsageLimit" min="0" value="100" placeholder="Total uses" />
        </div>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="couponStatus">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <button type="button" class="btn-submit" id="btnSaveCoupon" onclick="saveCoupon()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="btnSaveText">Save Coupon</span>
      </button>

      <button type="button" class="btn-reset" onclick="resetForm()">Reset Form</button>
    </div>

    <!-- Table Card -->
    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-box">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchCoupon" placeholder="Search coupon by code..." oninput="renderCoupons()" />
        </div>
        <div style="font-size: 12px; color: var(--ink-faint); font-weight: 600;" id="couponCountLabel">
          0 Coupons
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Coupon Code</th>
              <th>Discount</th>
              <th>Min Recharge</th>
              <th>Expiry Date</th>
              <th>Usage</th>
              <th>Status</th>
              <th style="text-align: right; padding-right: 18px;">Actions</th>
            </tr>
          </thead>
          <tbody id="couponTableBody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toastBox">
  <svg width="16" height="16" fill="none" stroke="#22c55e" stroke-width="2.5" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <span id="toastMsg">Coupon saved successfully!</span>
</div>

<script>
  const STORAGE_KEY = 'pos_coupons';

  // Sample initial coupons if none stored yet
  const DEFAULT_COUPONS = [
    {
      id: 'c1',
      code: 'WELCOME50',
      type: 'flat',
      value: 50,
      minBill: 300,
      maxDiscount: 0,
      expiry: '2027-12-31',
      usageLimit: 500,
      usedCount: 18,
      status: 'active'
    },
    {
      id: 'c2',
      code: 'DIWALI20',
      type: 'percent',
      value: 20,
      minBill: 500,
      maxDiscount: 150,
      expiry: '2026-11-30',
      usageLimit: 200,
      usedCount: 42,
      status: 'active'
    },
    {
      id: 'c3',
      code: 'FLAT100',
      type: 'flat',
      value: 100,
      minBill: 1000,
      maxDiscount: 0,
      expiry: '2027-06-30',
      usageLimit: 100,
      usedCount: 9,
      status: 'active'
    }
  ];

  function getCoupons() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_COUPONS));
    return DEFAULT_COUPONS;
  }

  function saveCouponsList(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function handleTypeChange() {
    const t = document.getElementById('couponType').value;
    const lbl = document.getElementById('lblDiscountVal');
    const grpMax = document.getElementById('grpMaxDiscount');
    if (t === 'percent') {
      lbl.textContent = 'Discount Value (%) *';
      grpMax.style.display = 'flex';
    } else {
      lbl.textContent = 'Discount Value (₹) *';
      grpMax.style.display = 'none';
    }
  }

  function resetForm() {
    document.getElementById('couponEditId').value = '';
    document.getElementById('couponCode').value = '';
    document.getElementById('couponType').value = 'flat';
    document.getElementById('couponValue').value = '';
    document.getElementById('couponMinBill').value = '0';
    document.getElementById('couponMaxDiscount').value = '';
    document.getElementById('couponExpiry').value = '';
    document.getElementById('couponUsageLimit').value = '100';
    document.getElementById('couponStatus').value = 'active';
    document.getElementById('formCardTitle').innerHTML = `
      <svg width="16" height="16" fill="none" stroke="#ec4899" stroke-width="2.2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Add New Coupon
    `;
    document.getElementById('btnSaveText').textContent = 'Save Coupon';
    handleTypeChange();
  }

  function saveCoupon() {
    const code = document.getElementById('couponCode').value.trim().toUpperCase();
    const type = document.getElementById('couponType').value;
    const val = parseFloat(document.getElementById('couponValue').value);
    const minBill = parseFloat(document.getElementById('couponMinBill').value) || 0;
    const maxDiscount = parseFloat(document.getElementById('couponMaxDiscount').value) || 0;
    const expiry = document.getElementById('couponExpiry').value;
    const usageLimit = parseInt(document.getElementById('couponUsageLimit').value) || 100;
    const status = document.getElementById('couponStatus').value;
    const editId = document.getElementById('couponEditId').value;

    if (!code) {
      alert('Please enter a Coupon Code.');
      return;
    }
    if (isNaN(val) || val <= 0) {
      alert('Please enter a valid Discount Value.');
      return;
    }
    if (type === 'percent' && val > 100) {
      alert('Percentage discount cannot exceed 100%.');
      return;
    }

    const coupons = getCoupons();

    if (editId) {
      const idx = coupons.findIndex(c => c.id === editId);
      if (idx !== -1) {
        coupons[idx] = {
          ...coupons[idx],
          code, type, value: val, minBill, maxDiscount, expiry, usageLimit, status
        };
        saveCouponsList(coupons);
        showToast(`✓ Coupon "${code}" updated successfully!`);
      }
    } else {
      const exists = coupons.some(c => c.code === code);
      if (exists) {
        alert(`Coupon code "${code}" already exists! Please use a unique code.`);
        return;
      }
      const newCoupon = {
        id: 'c_' + Date.now(),
        code,
        type,
        value: val,
        minBill,
        maxDiscount,
        expiry: expiry || '2027-12-31',
        usageLimit,
        usedCount: 0,
        status
      };
      coupons.unshift(newCoupon);
      saveCouponsList(coupons);
      showToast(`✓ Coupon "${code}" created successfully!`);
    }

    resetForm();
    renderCoupons();
  }

  function editCoupon(id) {
    const coupons = getCoupons();
    const c = coupons.find(x => x.id === id);
    if (!c) return;

    document.getElementById('couponEditId').value = c.id;
    document.getElementById('couponCode').value = c.code;
    document.getElementById('couponType').value = c.type;
    document.getElementById('couponValue').value = c.value;
    document.getElementById('couponMinBill').value = c.minBill || 0;
    document.getElementById('couponMaxDiscount').value = c.maxDiscount || '';
    document.getElementById('couponExpiry').value = c.expiry || '';
    document.getElementById('couponUsageLimit').value = c.usageLimit || 100;
    document.getElementById('couponStatus').value = c.status || 'active';

    document.getElementById('formCardTitle').innerHTML = `
      <svg width="16" height="16" fill="none" stroke="#4f46e5" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      Edit Coupon: ${c.code}
    `;
    document.getElementById('btnSaveText').textContent = 'Update Coupon';
    handleTypeChange();
  }

  function toggleCouponStatus(id) {
    const coupons = getCoupons();
    const c = coupons.find(x => x.id === id);
    if (!c) return;
    c.status = (c.status === 'active') ? 'inactive' : 'active';
    saveCouponsList(coupons);
    renderCoupons();
    showToast(`✓ Coupon "${c.code}" is now ${c.status.toUpperCase()}!`);
  }

  function deleteCoupon(id) {
    const coupons = getCoupons();
    const c = coupons.find(x => x.id === id);
    if (!c) return;
    if (confirm(`Are you sure you want to delete coupon "${c.code}"?`)) {
      const filtered = coupons.filter(x => x.id !== id);
      saveCouponsList(filtered);
      renderCoupons();
      showToast(`✓ Coupon "${c.code}" deleted!`);
    }
  }

  function renderCoupons() {
    const search = document.getElementById('searchCoupon').value.trim().toLowerCase();
    const coupons = getCoupons();
    const tbody = document.getElementById('couponTableBody');

    const filtered = coupons.filter(c => !search || c.code.toLowerCase().includes(search));

    document.getElementById('couponCountLabel').textContent = `${filtered.length} of ${coupons.length} Coupons`;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 32px; color: #94a3b8;">No coupons found. Create one from the left panel!</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(c => {
      const discountText = c.type === 'percent'
        ? `<strong style="color: #ec4899;">${c.value}% OFF</strong>${c.maxDiscount ? ` (Up to ₹${c.maxDiscount})` : ''}`
        : `<strong style="color: #059669;">₹${c.value.toFixed(2)} FLAT</strong>`;
      const minBillText = c.minBill > 0 ? `₹${c.minBill.toFixed(2)}` : 'None';
      const statusBadge = c.status === 'active'
        ? `<span class="badge-status active" onclick="toggleCouponStatus('${c.id}')" title="Click to disable" style="cursor: pointer;">Active</span>`
        : `<span class="badge-status inactive" onclick="toggleCouponStatus('${c.id}')" title="Click to activate" style="cursor: pointer;">Inactive</span>`;

      return `
        <tr>
          <td><span class="badge-code">${c.code}</span></td>
          <td>${discountText}</td>
          <td>${minBillText}</td>
          <td>${c.expiry || 'No Expiry'}</td>
          <td><span style="font-weight: 600;">${c.usedCount || 0}</span> / ${c.usageLimit || '∞'}</td>
          <td>${statusBadge}</td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn-action-icon" onclick="editCoupon('${c.id}')" title="Edit Coupon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="btn-action-icon delete" onclick="deleteCoupon('${c.id}')" title="Delete Coupon" style="margin-left: 4px;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function handleBack() {
    if (window.parent && window.parent.document) {
      const masterBtn = window.parent.document.getElementById('masterMenuBtn');
      if (masterBtn) {
        masterBtn.click();
        return;
      }
      const masterContent = window.parent.document.getElementById('masterContent');
      const manageCouponsContent = window.parent.document.getElementById('manageCouponsContent');
      if (manageCouponsContent && masterContent) {
        manageCouponsContent.style.display = 'none';
        masterContent.style.display = 'block';
        return;
      }
    }
    history.back();
  }

  let toastTimer = null;
  function showToast(msg) {
    const box = document.getElementById('toastBox');
    document.getElementById('toastMsg').textContent = msg;
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      box.classList.remove('show');
    }, 2500);
  }

  // Initial load
  getCoupons();
  renderCoupons();
  handleTypeChange();
</script>

</body>
</html>
