<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Login</title>
    <!-- Modern Typography from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Vibrant Color Palette */
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('img/login.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            /* Aligns content to the right */
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Glassmorphic Login Container taking the right side */
        .login-container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border);
            padding: 4rem 3rem;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            /* Full height on right side */
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .login-header {
            margin-bottom: 3rem;
        }

        .login-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .form-group:focus-within label {
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.875rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .forgot-password {
            display: table;
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            margin-top: 0.5rem;
            transition: color 0.3s;
            position: relative;
        }

        .forgot-password::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #818cf8;
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }

        .forgot-password:hover {
            color: #818cf8;
        }

        .forgot-password:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Glowing Animated Primary Button */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.6);
        }

        .btn-login:hover::before {
            transform: translateX(100%);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Mobile responsive: Snap form to bottom on small screens */
        @media (max-width: 768px) {
            .login-container {
                max-width: 100%;
                border-left: none;
                border-radius: 24px 24px 0 0;
                height: auto;
                margin-top: auto;
                padding: 3rem 2rem;
                box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
                animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            @keyframes slideUp {
                from {
                    transform: translateY(100%);
                }

                to {
                    transform: translateY(0);
                }
            }
        }

        /* Toast Notification Styles */
        .toast {
            position: absolute;
            top: 9rem;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
        <div style="text-align: center;"><small>Developed By</small></div>
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="img/companylogo.png" alt="Company Logo" style="max-height: 65px; max-width: 300px;">
        </div>
        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Enter your credentials to access your account</p>
        </div>

        <form action="#" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="username" autocomplete="username"
                    autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="******"
                    autocomplete="current-password">
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login">Sign In</button>

        </form>
    </main>

    <script>
        document.querySelector('.forgot-password').addEventListener('click', function (e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value.trim();
            const toast = document.getElementById('toast');

            // Remove previous classes
            toast.className = 'toast';

            if (username === '') {
                toast.textContent = 'Please enter your username first.';
                toast.classList.add('error');
                usernameInput.focus();
            } else {
                toast.textContent = 'Password sent to registered mobile number.';
                toast.classList.add('success');
            }

            // Show toast
            toast.classList.add('show');

            // Hide toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        });
    </script>
</body>

</html>
